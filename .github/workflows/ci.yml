name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        ruby-version: ["3.0", "3.1", "3.2", "3.3", "4.0"]

    steps:
      - uses: actions/checkout@v4

      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Run tests
        run: just spec

      - name: Build and install gem
        run: just build

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Run rubocop
        run: just lint-check
